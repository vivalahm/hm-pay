import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'org.springframework.boot' version '3.4.0' apply false
    id 'io.spring.dependency-management' version '1.1.5' apply false

    id 'org.jetbrains.kotlin.jvm' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.kapt' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.plugin.noarg' version '2.1.20' apply false

    id 'com.github.ben-manes.versions' version '0.52.0' apply false
}

ext {
    kotlinVersion    = '2.1.20'
    springdocVersion = '2.8.11'   // Boot 3.4.x와 호환
    archunitVersion  = '1.4.1'
}

allprojects {
    repositories { mavenCentral() }

    apply plugin: 'com.github.ben-manes.versions'

    ext.isNonStable = { String version ->
        def stableKeyword = ['RELEASE','FINAL','GA'].any { kw -> version?.toUpperCase()?.contains(kw) }
        def regex = /^[0-9,.v-]+(-r)?$/
        return !stableKeyword && !(version ==~ regex)
    }

    tasks.named("dependencyUpdates").configure {
        rejectVersionIf { sel ->
            def candidate = sel.candidate.version
            def current   = sel.currentVersion
            return isNonStable(candidate) && !isNonStable(current)
        }
        checkForGradleUpdate = true
        revision = 'release'
        outputFormatter = 'plain'
        outputDir = layout.buildDirectory.dir("reports/dependency-updates").get().asFile
        reportfileName = 'report'
    }
}

subprojects {
    // 100% Kotlin 프로젝트 공통 플러그인
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'org.jetbrains.kotlin.plugin.spring'
    apply plugin: 'org.jetbrains.kotlin.kapt'
    apply plugin: 'org.jetbrains.kotlin.plugin.jpa'
    apply plugin: 'org.jetbrains.kotlin.plugin.noarg'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(17) }
    }

    tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
            freeCompilerArgs.addAll(
                    "-Xjsr305=strict",
                    "-Xjvm-default=all"
            )
        }
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-reflect:${kotlinVersion}"
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlinVersion}"

        // Kotlin에서 configuration metadata 생성은 kapt만
        kapt "org.springframework.boot:spring-boot-configuration-processor"

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'io.mockk:mockk:1.13.13'
        testImplementation 'io.kotest:kotest-runner-junit5:5.9.1'

        // 필요 모듈로 이동 가능(지금은 공통 유지)
        implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
        testImplementation "com.tngtech.archunit:archunit:${archunitVersion}"
    }

    // JPA 엔티티 no-arg 생성자
    noArg {
        annotation("jakarta.persistence.Entity")
        annotation("jakarta.persistence.Embeddable")
        annotation("jakarta.persistence.MappedSuperclass")
    }

    test {
        useJUnitPlatform()
        maxHeapSize = "1024m"
    }

    // app/lib 분리 시 각 모듈에서 bootJar/jar enable 제어 권장
}